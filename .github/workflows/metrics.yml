name: Generate Metrics

on:
  schedule:
    - cron: "20 */6 * * *"
  workflow_dispatch:

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Comprehensive Metrics
        uses: lowlighter/metrics@v3.34
        with:
          filename: metrics/github-metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: moamenelbarky
          template: classic
          base: header, activity, community, repositories
          config_timezone: Africa/Cairo
          config_display: large
          config_padding: 5%
          committer_branch: main
          committer_message: "📊 Update GitHub metrics [skip ci]"

          # Count contributions from personal and organization repositories
          repositories_affiliations: owner, collaborator, organization_member

          # Isometric Calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # Languages
          plugin_languages: yes
          plugin_languages_categories: programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 15

          # Achievements
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_display: compact

          # Stars
          plugin_stars: yes
          plugin_stars_limit: 4
