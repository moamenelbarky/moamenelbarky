name: Generate 3D Contribution Calendar

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

concurrency:
  group: 3d-contrib
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate 3D Contribution Calendar
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate 3D Contribution SVG
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: moamenelbarky
          SETTING_JSON: .github/3d-contrib-settings.json

      - name: Commit and push changes
        run: |
          mkdir -p /tmp/profile-3d-backup
          cp -r profile-3d-contrib /tmp/profile-3d-backup/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          mkdir -p profile-3d-contrib
          cp -r /tmp/profile-3d-backup/profile-3d-contrib/* profile-3d-contrib/
          git add profile-3d-contrib/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "🎨 Update 3D contribution calendar [skip ci]"
          git push origin main
